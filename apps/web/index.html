    <!-- Starts the dashboard's opening requests during HTML parse, before the app
         bundle has finished downloading. Without this the first byte of data
         cannot be asked for until the entry chunk has arrived and been parsed,
         React has mounted, and the dashboard's effect has run — on a phone that
         ordering leaves the connection idle for several hundred milliseconds.

         Inline rather than a <script src>: an external classic script blocks the
         parser until it has been fetched and run, which would delay discovery of
         the module preloads below and cost more than the head start is worth.

         Everything here is best-effort. A missing token, an unusual deployment,
         a rejected fetch: all fall through silently and the app fetches
         normally. It must never throw, and never be why a page fails to start. -->
    <script>
      (function () {
        "use strict";

        try {
          // Only the landing route. Any other entry point renders a different page,
          // and these responses would be fetched for nothing.
          if (window.location.pathname !== "/") return;

          var base = (
            (window.localStorage.getItem("cataloggy_api_base_override") || "").trim() ||
            window.__CATALOGGY_API_BASE__ ||
            ""
          ).replace(/\/+$/, "");
          if (!base) return;

          var token = window.localStorage.getItem("cataloggy_token");
          var profileId = window.localStorage.getItem("cataloggy_profile_id");
          // No token means the setup wizard, no profile means the profile picker —
          // neither of which shows any of this.
          if (!token || !profileId) return;

          var headers = {
            Authorization: "Bearer " + token,
            "x-profile-id": profileId,
          };
          var profileToken = window.localStorage.getItem("cataloggy_profile_token");
          if (profileToken) headers["x-profile-token"] = profileToken;

          // These must stay character-for-character what api.ts requests, since that
          // is how it recognises them. A mismatch is not a breakage — the response
          // goes unclaimed and the app fetches again — but it is a wasted request.
          var paths = ["/series/progress", "/watch/history?limit=20&offset=0", "/watch/stats"];

          var preloaded = {};
          for (var i = 0; i < paths.length; i++) {
            (function (path) {
              preloaded[path] = fetch(base + path, { headers: headers }).catch(function () {
                // Claimed and discarded by api.ts, which then fetches normally.
                return null;
              });
            })(paths[i]);
          }

          window.__CATALOGGY_PRELOAD__ = preloaded;
        } catch {
          // Private-mode localStorage, a blocked fetch, anything at all — startup
          // matters more than this optimisation.
        }
      })();
    </script>
    <style>
      #initial-loader {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: inherit;
      }
      #initial-loader .spinner {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        border: 3px solid rgba(150, 150, 150, 0.25);
        /* theme-init.js sets --loader-accent from the live theme's --accent
           before this paints. The fallback is the light theme's accent, for
           the case where that script did not run at all. */
        border-top-color: var(--loader-accent, #d97742);
        animation: initial-loader-spin 0.8s linear infinite;
      }
      @keyframes initial-loader-spin {
        to { transform: rotate(360deg); }
      }
      #root:not(:empty) ~ #initial-loader {
        display: none;
      }

    <div id="initial-loader" aria-hidden="true"><div class="spinner"></div></div>
    <script type="module" src="/src/main.tsx"></script>
