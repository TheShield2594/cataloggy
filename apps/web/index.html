    <!-- Nearly every poster on every page comes from here, and the first one
         otherwise pays DNS + TCP + TLS before a single byte of image arrives.
         Opening the connection alongside the app's own JS takes that setup off
         the critical path. `crossorigin` matches how <img> fetches these
         (anonymous, no credentials) — without it the browser would warm a
         connection the image requests can't reuse. -->

    <style>
      #initial-loader {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: inherit;
      }
      #initial-loader .spinner {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        border: 3px solid rgba(150, 150, 150, 0.25);
        border-top-color: #d6502a;
        animation: initial-loader-spin 0.8s linear infinite;
      }
      @keyframes initial-loader-spin {
        to { transform: rotate(360deg); }
      }
      #root:not(:empty) ~ #initial-loader {
        display: none;
      }
    </style>

    <div id="root"></div>
    <div id="initial-loader" aria-hidden="true"><div class="spinner"></div></div>
