packages:
  - "apps/*"
  - "packages/*"

# pnpm 11 reads these settings here; the `pnpm` field in package.json is ignored.
overrides:
  workbox-build: "^7.4.1"
  workbox-window: "^7.4.1"
  serialize-javascript: "^7.0.3"
  find-my-way: "^9.7.0"
  fast-uri: "^4.1.3"
  "ajv>fast-uri": "^3.1.6"
  # GHSA-qhr7-859c-m2p7 and GHSA-6j4f-fj2g-mc7p (brace-expansion),
  # GHSA-rfgv-xxqx-mfg5 and GHSA-w293-vg96-wgc3 (undici), GHSA-68fv-2mgg-jv7q
  # (source-map-js). All three are reached only transitively, so the fixed
  # versions have to be forced here.
  brace-expansion: "^5.0.11"
  undici: "^8.10.2"
  source-map-js: "^1.2.2"
  # GHSA-587h-7wmj-h5pm (vite's bundled launch-editor; Windows dev server only).
  # apps/web depends on vite directly, but vitest pulls in its own copy, so the
  # direct bump alone left 8.2.1 in the tree.
  vite: "^8.3.4"
  # GHSA-2v37-7h3g-55p8. Reached only through the dev toolchain — postcss is
  # the sole dependent, via vite via vitest — so nothing shipped in an image
  # was affected, but it fails `pnpm audit --audit-level=high` in CI.
  nanoid: "^3.3.17"
  # GHSA-3f6p-5ww8-9rcr (mysql2) and GHSA-ggr8-5vv4-36mx (deepmerge-ts). Both
  # are reached only through the `prisma` CLI — mysql2 via its connectors,
  # deepmerge-ts via @prisma/config — which a Postgres-only install never
  # exercises, but they fail `pnpm audit --audit-level=high` in CI.
  mysql2: "^3.22.0"
  deepmerge-ts: "^8.0.0"

# pnpm does not run a dependency's install scripts unless it is approved here.
# Prisma downloads its query engine that way, esbuild its platform binary.
allowBuilds:
  "@prisma/engines": true
  esbuild: true
  prisma: true

# Mirrors `node-linker=hoisted` in .npmrc, which pnpm 11 no longer reads.
# Without this the layout silently switches to the isolated default.
nodeLinker: hoisted

# Peers have to be declared by the project that needs them, rather than pnpm
# adding them on its own. Auto-installing turns them into real dependencies of
# the package that named them, so `@prisma/client` — which only names the
# `prisma` CLI so that `prisma generate` is available — dragged the CLI and its
# Studio/dev tooling into every production install of the API, roughly 250 MB
# that nothing loads at runtime. The peers this repo does need are in the
# devDependencies of the projects using them.
autoInstallPeers: false
