packages:
  - "apps/*"
  - "packages/*"

# pnpm 11 reads these settings here; the `pnpm` field in package.json is ignored.
overrides:
  workbox-build: "^7.4.1"
  workbox-window: "^7.4.1"
  serialize-javascript: "^7.0.3"
  find-my-way: "^9.7.0"
  fast-uri: "^4.1.1"
  "ajv>fast-uri": "^3.1.4"
  brace-expansion: "^5.0.8"

# pnpm does not run a dependency's install scripts unless it is approved here.
# Prisma downloads its query engine that way, esbuild its platform binary.
allowBuilds:
  "@prisma/engines": true
  esbuild: true
  prisma: true

# Mirrors `node-linker=hoisted` in .npmrc, which pnpm 11 no longer reads.
# Without this the layout silently switches to the isolated default.
nodeLinker: hoisted

# Peers have to be declared by the project that needs them, rather than pnpm
# adding them on its own. Auto-installing turns them into real dependencies of
# the package that named them, so `@prisma/client` — which only names the
# `prisma` CLI so that `prisma generate` is available — dragged the CLI and its
# Studio/dev tooling into every production install of the API, roughly 250 MB
# that nothing loads at runtime. The peers this repo does need are in the
# devDependencies of the projects using them.
autoInstallPeers: false
