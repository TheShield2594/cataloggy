version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      npm-dependencies:
        patterns:
          - "*"
    ignore:
      # typescript-eslint's peer range on typescript stops at <6.1.0, and it
      # throws on load rather than degrading, so `pnpm lint` hard-errors on
      # anything past 6.0.x -- a 6.1 minor breaks it just as surely as 7.0.
      # Leaving patch bumps alone keeps 6.0.x security fixes flowing. Drop
      # this ignore once typescript-eslint ships TS 7 support:
      # https://github.com/typescript-eslint/typescript-eslint/issues/10940
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"

  # docker-compose.yml, for the digest-pinned postgres image.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/apps/api"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/apps/web"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/apps/addon"
    schedule:
      interval: "weekly"
