name: Build and Publish Docker Images

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/theshield2594/cataloggy

jobs:
  # The same job CI runs, not a copy of it — including the Postgres service and
  # `prisma migrate deploy`. A migration that fails to apply has to stop the
  # publish, because the `migrate` container runs that exact command and the
  # `api` service waits on it succeeding; an image published past a broken
  # migration leaves a self-hoster with an API that never starts. This also
  # covers `v*` tag pushes and manual runs, which ci.yml never sees.
  verify:
    uses: ./.github/workflows/verify.yml
    permissions:
      contents: read

  build-and-push:
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      # Every image also gets a `sha-<short-sha>` tag (and a semver tag when
      # triggered by a `vX.Y.Z` tag push) so self-hosters can pin a known-good
      # version and roll back, instead of only ever having `:latest`.
      - name: Compute image tags
        id: vars
        run: |
          SHORT_SHA=$(git rev-parse --short=12 HEAD)
          VERSION=""
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VERSION="$GITHUB_REF_NAME"
          fi
          {
            echo "sha=$SHORT_SHA"
            echo "version=$VERSION"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push API image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-api:latest
            ${{ env.IMAGE_PREFIX }}-api:sha-${{ steps.vars.outputs.sha }}
            ${{ steps.vars.outputs.version && format('{0}-api:{1}', env.IMAGE_PREFIX, steps.vars.outputs.version) }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Same Dockerfile as the API, stopping at the `migrate` stage. It carries
      # the Prisma CLI so the API image does not have to.
      - name: Build and push Migrate image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: apps/api/Dockerfile
          target: migrate
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-migrate:latest
            ${{ env.IMAGE_PREFIX }}-migrate:sha-${{ steps.vars.outputs.sha }}
            ${{ steps.vars.outputs.version && format('{0}-migrate:{1}', env.IMAGE_PREFIX, steps.vars.outputs.version) }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Addon image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: apps/addon/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-addon:latest
            ${{ env.IMAGE_PREFIX }}-addon:sha-${{ steps.vars.outputs.sha }}
            ${{ steps.vars.outputs.version && format('{0}-addon:{1}', env.IMAGE_PREFIX, steps.vars.outputs.version) }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Web image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-web:latest
            ${{ env.IMAGE_PREFIX }}-web:sha-${{ steps.vars.outputs.sha }}
            ${{ steps.vars.outputs.version && format('{0}-web:{1}', env.IMAGE_PREFIX, steps.vars.outputs.version) }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
