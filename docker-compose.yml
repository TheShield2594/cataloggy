# All four app images move together, so the version they run is one setting:
# CATALOGGY_IMAGE_TAG in .env. It defaults to `latest`, which follows whatever
# was last built from main — fine for trying Cataloggy out, but it means
# `docker compose pull` can move you onto an untested build, and there is no
# version to roll back to. Once the stack works, pin it: every image is also
# published as `sha-<short-sha>` and, for tagged releases, `vX.Y.Z`.
#
#     CATALOGGY_IMAGE_TAG=v1.2.0
#
# Rolling back is the same edit with the previous tag, followed by
# `docker compose pull && docker compose up -d`. Keep the four images on the
# same tag — the migrate image applies the schema the api image expects.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    # Digest-pinned so a rebuild pulls the exact image this stack was tested
    # against; the tag is kept alongside it for readability. Dependabot bumps
    # the pair together (see .github/dependabot.yml).
    image: postgres:16@sha256:33f923b05f64ca54ac4401c01126a6b92afe839a0aa0a52bc5aeb5cc958e5f20
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cataloggy}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in a .env file next to docker-compose.yml — see README.md}
    # Bind Postgres to loopback only. The api/addon services reach it over the
    # internal "cataloggy" Docker network (host db:5432), so no host mapping is
    # needed for the app to work. Publishing on 0.0.0.0 would expose the
    # database — including stored OAuth tokens — to the whole LAN (and the
    # internet if the host is port-forwarded), bypassing API_TOKEN entirely.
    # Loopback keeps host-side psql/backups working without that exposure.
    # Remove this block entirely if you never need host-side DB access.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    # The database entrypoint still needs the capabilities it uses to chown
    # the data directory and drop to the postgres user at init, so only the
    # privilege-escalation block applies here.
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cataloggy"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *default-logging
    networks:
      - cataloggy

  # Applies pending database migrations, then exits. The api service waits for
  # it to finish. It ships as a separate image because it needs the Prisma CLI,
  # which is around 250 MB of tooling the api service never loads — keeping the
  # CLI out of that image is what lets it stay small.
  migrate:
    image: ghcr.io/theshield2594/cataloggy-migrate:${CATALOGGY_IMAGE_TAG:-latest}
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in a .env file next to docker-compose.yml — see README.md}@db:5432/${POSTGRES_DB:-cataloggy}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    # Nothing in these services runs as root, binds a low port, or changes
    # file ownership, so they need no Linux capabilities at all.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging: *default-logging
    networks:
      - cataloggy

  api:
    image: ghcr.io/theshield2594/cataloggy-api:${CATALOGGY_IMAGE_TAG:-latest}
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in a .env file next to docker-compose.yml — see README.md}@db:5432/${POSTGRES_DB:-cataloggy}
      PORT: "7000"
      API_TOKEN: ${API_TOKEN:?Set API_TOKEN in a .env file next to docker-compose.yml — see README.md}
      CATALOGGY_ALLOWED_ORIGINS: ${CATALOGGY_ALLOWED_ORIGINS:-http://192.168.1.25:7002,http://localhost:7002,http://127.0.0.1:7002}
      CATALOGGY_API_PUBLIC: ${CATALOGGY_API_PUBLIC:-http://192.168.1.25:7000}
      # Public URL of the web service — used to build the "Configure" link
      # Stremio shows for this addon's manifest (redirects to /settings), and
      # the link notification channels point at. Without it, notifications are
      # still sent, just with nothing to tap.
      CATALOGGY_WEB_PUBLIC: ${CATALOGGY_WEB_PUBLIC:-http://192.168.1.25:7002}
      # Optional integrations — set these in a .env file or export them.
      # Leaving them unset is safe; the API validates at startup/request time
      # and returns clear error messages if they are missing when needed.
      TRAKT_CLIENT_ID: ${TRAKT_CLIENT_ID}
      TRAKT_CLIENT_SECRET: ${TRAKT_CLIENT_SECRET}
      TRAKT_REDIRECT_URI: ${TRAKT_REDIRECT_URI:-http://192.168.1.25:7000/trakt/oauth/callback}
      TRAKT_POLL_INTERVAL_SEC: ${TRAKT_POLL_INTERVAL_SEC:-300}
      TRAKT_POLL_MAX_PAGES: ${TRAKT_POLL_MAX_PAGES:-20}
      TRAKT_BACKFILL_MAX_PAGES: ${TRAKT_BACKFILL_MAX_PAGES:-500}
      TRAKT_WATCHLIST_MIRROR_DELETES: ${TRAKT_WATCHLIST_MIRROR_DELETES:-false}
      STREMIO_POLL_INTERVAL_SEC: ${STREMIO_POLL_INTERVAL_SEC:-0}
      STREMIO_API_BASE: ${STREMIO_API_BASE:-https://api.strem.io}
      STREMIO_PLAY_DETECTION: ${STREMIO_PLAY_DETECTION:-false}
      TMDB_API_KEY: ${TMDB_API_KEY}
      AI_REFRESH_INTERVAL_SEC: ${AI_REFRESH_INTERVAL_SEC:-86400}
      TWITCH_CLIENT_ID: ${TWITCH_CLIENT_ID}
      TWITCH_CLIENT_SECRET: ${TWITCH_CLIENT_SECRET}
      STEAM_API_KEY: ${STEAM_API_KEY}
      STEAM_ID: ${STEAM_ID}
      STEAM_SYNC_INTERVAL_SEC: ${STEAM_SYNC_INTERVAL_SEC:-86400}
      # Optional: report unhandled errors to a Sentry project. Leave unset
      # to disable error tracking entirely (default).
      SENTRY_DSN: ${SENTRY_DSN}
    ports:
      - "7000:7000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    # Nothing in these services runs as root, binds a low port, or changes
    # file ownership, so they need no Linux capabilities at all.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:7000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging: *default-logging
    networks:
      - cataloggy

  addon:
    image: ghcr.io/theshield2594/cataloggy-addon:${CATALOGGY_IMAGE_TAG:-latest}
    environment:
      PORT: "7001"
      CATALOGGY_API_BASE: http://api:7000
      CATALOGGY_API_TOKEN: ${API_TOKEN:?Set API_TOKEN in a .env file next to docker-compose.yml — see README.md}
      ADDON_PUBLIC_BASE: ${ADDON_PUBLIC_BASE:-http://192.168.1.25:7001}
      # Public URL of the web service — used to build the "Configure" link
      # Stremio shows for this addon's manifest (redirects to /settings).
      CATALOGGY_WEB_PUBLIC: ${CATALOGGY_WEB_PUBLIC:-http://192.168.1.25:7002}
      # Must match the api service's value — the addon observes the signals and
      # the api decides what to do with them, so enabling it on only one side
      # does nothing.
      STREMIO_PLAY_DETECTION: ${STREMIO_PLAY_DETECTION:-false}
      SENTRY_DSN: ${SENTRY_DSN}
    ports:
      - "7001:7001"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    # Nothing in these services runs as root, binds a low port, or changes
    # file ownership, so they need no Linux capabilities at all.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:7001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging: *default-logging
    networks:
      - cataloggy

  web:
    image: ghcr.io/theshield2594/cataloggy-web:${CATALOGGY_IMAGE_TAG:-latest}
    environment:
      VITE_API_BASE: ${VITE_API_BASE:-http://192.168.1.25:7000}
      # Public URL of the dedicated addon service — the full-featured
      # Stremio addon (meta/subtitles/search/genre support). Used to build
      # the manifest URL shown in Settings.
      VITE_ADDON_BASE: ${VITE_ADDON_BASE:-http://192.168.1.25:7001}
      # Comma-separated hostnames allowed to reach the web server, beyond
      # IPs/localhost (which are always allowed) — e.g. a domain proxied via
      # Nginx Proxy Manager. Leave unset for LAN-IP-only access.
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-}
      # Extra origins the browser may connect to, on top of VITE_API_BASE,
      # VITE_ADDON_BASE and SENTRY_DSN (already allowed by the page's
      # Content-Security-Policy). Only needed when some browsers reach the API
      # at a different address — e.g. one set per-browser in Settings.
      CSP_CONNECT_SRC_EXTRA: ${CSP_CONNECT_SRC_EXTRA:-}
      SENTRY_DSN: ${SENTRY_DSN}
    ports:
      - "7002:7002"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    # Nothing in these services runs as root, binds a low port, or changes
    # file ownership, so they need no Linux capabilities at all.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:7002/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging: *default-logging
    networks:
      - cataloggy

volumes:
  pgdata:

networks:
  cataloggy:
    driver: bridge
